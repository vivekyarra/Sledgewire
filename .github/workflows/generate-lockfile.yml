name: Generate lockfile

on:
  push:
    branches:
      - hardening/arena-proof-live-gate
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit lockfile for capture
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const b=fs.readFileSync('package-lock.json').toString('base64');
          console.log('SLEDGEWIRE_LOCKFILE_BEGIN');
          for(let i=0;i<b.length;i+=4000) console.log(b.slice(i,i+4000));
          console.log('SLEDGEWIRE_LOCKFILE_END');
          NODE
